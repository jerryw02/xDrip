name: Unit Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ 17 ]

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-java@v2
      with:
        java-version: ${{ matrix.java-version }}
        distribution: adopt
    - name: Run unit tests and assemble APKs
      uses: gradle/gradle-build-action@v2
      with:
        arguments: assembleProdRelease testProdReleaseUnitTest
    - name: Check Output
      run: bash ./etc/CheckBuild/check-release.sh test
     
     # 3. 关键：强制使用最新的 upload-artifact
    - name: Upload APK
      # 强制锁定版本
      uses: actions/upload-artifact@v4
      with:
        name: xDrip-Apk
        path: app/build/outputs/apk/prod/debug/*.apk
        # 如果文件路径不存在也不要报错，防止卡住
        if-no-files-found: warn 
